
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>My To-Do List</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <form id="task-form">
            <label for="task-input" class="sr-only">New task</label>
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                maxlength="200"
                required
            >
            <button type="submit" id="submit-btn">Add Task</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <nav class="filters" aria-label="Filter tasks">
            <button type="button" data-filter="all"
                class="active" aria-pressed="true">All</button>
            <button type="button" data-filter="active"
                aria-pressed="false">Active</button>
            <button type="button" data-filter="completed"
                aria-pressed="false">Completed</button>
        </nav>

        <div class="summary">
            <span id="task-count">0 tasks remaining</span>
            <span id="total-count">0 total tasks</span>
        </div>

        <ul id="task-list"></ul>

        <p id="empty-state">No tasks yet. Add your first task!</p>

        <button type="button" id="clear-completed">
            Clear Completed Tasks
        </button>
    </main>
</body>
</html>
